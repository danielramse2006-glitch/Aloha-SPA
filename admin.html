<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Aloha SPA</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #E8004F;
            --dark: #3D2424;
            --bg: #F8F8F8;
            --white: #FFFFFF;
            --success: #27ae60;
            --pending: #f39c12;
            --danger: #e74c3c;
        }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        
        /* Login Styles */
        #loginSection { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--dark); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .login-box { background: var(--white); padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .login-box input { padding: 15px; margin: 10px 0; width: 250px; border-radius: 10px; border: 1px solid #ddd; outline: none; transition: 0.3s; }
        .login-box input:focus { border-color: var(--primary); }
        .login-box button { background: var(--primary); color: white; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; font-weight: 600; width: 100%; }

        /* Main Dashboard */
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { color: var(--dark); margin: 0; font-size: 24px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--white); padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; border-bottom: 4px solid #ddd; }
        .stat-card.total { border-color: var(--dark); }
        .stat-card.confirmed { border-color: var(--success); }
        .stat-card.pending { border-color: var(--pending); }
        .stat-card h3 { margin: 0; font-size: 14px; color: #888; text-transform: uppercase; }
        .stat-card p { margin: 10px 0 0; font-size: 28px; font-weight: 600; color: var(--dark); }

        .table-card { background: var(--white); border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #fafafa; padding: 15px; text-align: left; font-size: 13px; color: #888; text-transform: uppercase; border-bottom: 1px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #eee; vertical-align: middle; }
        
        .status-pill { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
        .status-pendiente { background: #fff3e0; color: #e65100; }
        .status-confirmada { background: #e8f5e9; color: #2e7d32; }
        .status-cancelada { background: #ffebee; color: #c62828; }

        .btn-ws { background: #25d366; color: white; padding: 8px 12px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
        .refresh-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        
        select { padding: 8px; border-radius: 8px; border: 1px solid #eee; background: #fff; cursor: pointer; }

        /* Responsividad para Admin (Celular) */
        @media (max-width: 600px) {
            .container { margin: 10px auto; padding: 10px; }
            .header { flex-direction: column; gap: 15px; text-align: center; }
            .stats-grid { grid-template-columns: 1fr; }
            
            table, thead, tbody, th, td, tr { display: block; }
            thead tr { position: absolute; top: -9999px; left: -9999px; }
            tr { border: 1px solid #eee; border-radius: 15px; margin-bottom: 15px; padding: 10px; background: #fff; }
            td { border: none; position: relative; padding-left: 50% !important; text-align: right !important; }
            td:before {
                position: absolute; top: 15px; left: 15px; width: 45%; padding-right: 10px; 
                white-space: nowrap; font-weight: 600; color: #888; text-align: left;
            }
            td:nth-of-type(1):before { content: "FECHA"; }
            td:nth-of-type(2):before { content: "CLIENTE"; }
            td:nth-of-type(3):before { content: "SERVICIO"; }
            td:nth-of-type(4):before { content: "ESTADO"; }
            td:nth-of-type(5):before { content: "ACCIONES"; }
        }
    </style>
</head>
<body>
    <div id="loginSection">
        <div class="login-box">
            <h2 style="color: var(--dark); margin-bottom: 20px;">Aloha Admin</h2>
            <input type="password" id="adminKey" placeholder="Clave de acceso">
            <button onclick="login()">ENTRAR AL PANEL</button>
        </div>
    </div>

    <div class="container" id="mainSection" style="display: none;">
        <div class="header">
            <h1>Gestión de Citas - Aloha SPA</h1>
            <button class="refresh-btn" onclick="loadAppointments()">Actualizar Datos</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card total">
                <h3>Total Citas</h3>
                <p id="statTotal">0</p>
            </div>
            <div class="stat-card pending">
                <h3>Pendientes</h3>
                <p id="statPending">0</p>
            </div>
            <div class="stat-card confirmed">
                <h3>Confirmadas</h3>
                <p id="statConfirmed">0</p>
            </div>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Fecha y Hora</th>
                        <th>Cliente</th>
                        <th>Servicio</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="appointmentsTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin + '/api';
        let CURRENT_KEY = '';

        function login() {
            const key = document.getElementById('adminKey').value;
            if (!key) return alert('Ingresa la clave');
            CURRENT_KEY = key;
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('mainSection').style.display = 'block';
            loadAppointments();
        }

        async function loadAppointments() {
            try {
                const response = await fetch(`${API_URL}/admin/appointments`, {
                    headers: { 'X-API-KEY': CURRENT_KEY }
                });
                if (!response.ok) throw new Error('Clave incorrecta o sesión expirada');
                const data = await response.json();
                
                // Actualizar Stats
                document.getElementById('statTotal').textContent = data.length;
                document.getElementById('statPending').textContent = data.filter(a => a.status === 'pendiente').length;
                document.getElementById('statConfirmed').textContent = data.filter(a => a.status === 'confirmada').length;

                const tbody = document.getElementById('appointmentsTable');
                tbody.innerHTML = '';
                
                    data.forEach(app => {
                        const tr = document.createElement('tr');
                        // Formatear número para WhatsApp (quitar espacios, +, etc)
                        const waPhone = app.phone ? app.phone.replace(/\D/g, '') : '';
                        
                        tr.innerHTML = `
                            <td>
                                <div style="font-weight: 600;">${app.date}</div>
                                <div style="font-size: 12px; color: #888;">${app.time}</div>
                            </td>
                            <td>
                                <div style="font-weight: 600;">${app.name}</div>
                                <div style="font-size: 12px; color: #888;">${app.email}</div>
                                <div style="font-size: 12px; color: var(--primary); font-weight: 600;">${app.phone || 'Sin tel.'}</div>
                            </td>
                            <td>${app.service}</td>
                            <td>
                                <select onchange="updateStatus(${app.id}, this.value)" class="status-pill status-${app.status}">
                                    <option value="pendiente" ${app.status === 'pendiente' ? 'selected' : ''}>Pendiente</option>
                                    <option value="confirmada" ${app.status === 'confirmada' ? 'selected' : ''}>Confirmada</option>
                                    <option value="cancelada" ${app.status === 'cancelada' ? 'selected' : ''}>Cancelada</option>
                                </select>
                            </td>
                            <td>
                                ${app.phone ? `
                                    <a href="https://wa.me/${waPhone}?text=Hola%20${encodeURIComponent(app.name)}!%20Te%20contacto%20de%20Aloha%20SPA%20por%20tu%20cita%20de%20${encodeURIComponent(app.service)}." 
                                       class="btn-ws" target="_blank">
                                        📱 WhatsApp
                                    </a>
                                ` : '---'}
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
            } catch (err) {
                alert(err.message);
                document.getElementById('loginSection').style.display = 'flex';
                document.getElementById('mainSection').style.display = 'none';
            }
        }

        async function updateStatus(id, status) {
            try {
                const res = await fetch(`${API_URL}/admin/appointments/${id}`, {
                    method: 'PATCH',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-API-KEY': CURRENT_KEY
                    },
                    body: JSON.stringify({ status })
                });
                if (res.ok && status === 'confirmada') {
                    alert('¡Cita confirmada! Correo enviado a la clienta.');
                }
                loadAppointments();
            } catch (err) {
                alert('Error al actualizar estado');
            }
        }
    </script>
</body>
</html>
